service: fitness-tracker-mvp

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.10
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  memorySize: 256
  timeout: 30

  environment:
    USERS_TABLE: ${self:service}-users-${self:provider.stage}
    FOOD_LOGS_TABLE: ${self:service}-food-logs-${self:provider.stage}
    WEIGHT_LOGS_TABLE: ${self:service}-weight-logs-${self:provider.stage}
    S3_BUCKET: ${self:service}-food-images-${self:provider.stage}
    COGNITO_REGION: ${self:provider.region}
    COGNITO_USER_POOL_ID: ${ssm:/fitness-tracker/${self:provider.stage}/cognito-user-pool-id, ''}
    COGNITO_APP_CLIENT_ID: ${ssm:/fitness-tracker/${self:provider.stage}/cognito-app-client-id, ''}
    AWS_REGION_NAME: ${self:provider.region}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-users-${self:provider.stage}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-food-logs-${self:provider.stage}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-food-logs-${self:provider.stage}/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-weight-logs-${self:provider.stage}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-weight-logs-${self:provider.stage}/index/*
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
            - s3:GeneratePresignedPost
          Resource:
            - arn:aws:s3:::${self:service}-food-images-${self:provider.stage}/*
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: arn:aws:logs:*:*:*

plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: false
    zip: true
    layer: true
    slim: true
    useStaticCache: false      # ← disables the symlink cache
    useDownloadCache: false    # ← avoids the locked cache folder

package:
  individually: false
  exclude:
    - node_modules/**
    - .venv/**
    - __pycache__/**
    - "*.pyc"

functions:
  createUserProfile:
    handler: lambdas/create_user_profile.lambda_handler
    layers:
      - !Ref PythonRequirementsLambdaLayer
    events:
      - http:
          path: /profile
          method: GET
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref CognitoAuthorizer
      - http:
          path: /profile
          method: POST
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref CognitoAuthorizer
      - http:
          path: /profile
          method: PUT
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref CognitoAuthorizer

  addFoodLog:
    handler: lambdas/add_food_log.lambda_handler
    layers:
      - !Ref PythonRequirementsLambdaLayer
    events:
      - http:
          path: /food-logs
          method: GET
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref CognitoAuthorizer
      - http:
          path: /food-logs
          method: POST
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref CognitoAuthorizer
      - http:
          path: /food-logs/{log_id}
          method: DELETE
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref CognitoAuthorizer

  getDailyCalories:
    handler: lambdas/get_daily_calories.lambda_handler
    layers:
      - !Ref PythonRequirementsLambdaLayer
    events:
      - http:
          path: /dashboard
          method: GET
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref CognitoAuthorizer

  logWeight:
    handler: lambdas/log_weight.lambda_handler
    layers:
      - !Ref PythonRequirementsLambdaLayer
    events:
      - http:
          path: /weight-logs
          method: GET
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref CognitoAuthorizer
      - http:
          path: /weight-logs
          method: POST
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref CognitoAuthorizer

  uploadFoodImage:
    handler: lambdas/upload_food_image.lambda_handler
    layers:
      - !Ref PythonRequirementsLambdaLayer
    events:
      - http:
          path: /images/upload
          method: POST
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref CognitoAuthorizer
      - http:
          path: /images/download
          method: GET
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            authorizerId: !Ref CognitoAuthorizer

resources:
  Resources:
    # Cognito User Pool
    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: ${self:service}-user-pool-${self:provider.stage}
        UsernameAttributes:
          - email
        AutoVerifiedAttributes:
          - email
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireUppercase: true
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: false
        Schema:
          - Name: email
            AttributeDataType: String
            Required: true
            Mutable: true

    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: ${self:service}-client-${self:provider.stage}
        UserPoolId: !Ref CognitoUserPool
        ExplicitAuthFlows:
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_SRP_AUTH
        GenerateSecret: false
        AccessTokenValidity: 1
        IdTokenValidity: 1
        RefreshTokenValidity: 30
        TokenValidityUnits:
          AccessToken: days
          IdToken: days
          RefreshToken: days

    # API Gateway Cognito Authorizer
    CognitoAuthorizer:
      Type: AWS::ApiGateway::Authorizer
      Properties:
        Name: CognitoAuthorizer
        Type: COGNITO_USER_POOLS
        IdentitySource: method.request.header.Authorization
        RestApiId: !Ref ApiGatewayRestApi
        ProviderARNs:
          - !GetAtt CognitoUserPool.Arn

    # DynamoDB Tables
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-users-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: user_id
            AttributeType: S
        KeySchema:
          - AttributeName: user_id
            KeyType: HASH
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: false

    FoodLogsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-food-logs-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: log_id
            AttributeType: S
          - AttributeName: user_id
            AttributeType: S
          - AttributeName: date
            AttributeType: S
        KeySchema:
          - AttributeName: log_id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: user_id-date-index
            KeySchema:
              - AttributeName: user_id
                KeyType: HASH
              - AttributeName: date
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    WeightLogsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-weight-logs-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: log_id
            AttributeType: S
          - AttributeName: user_id
            AttributeType: S
          - AttributeName: date
            AttributeType: S
        KeySchema:
          - AttributeName: log_id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: user_id-date-index
            KeySchema:
              - AttributeName: user_id
                KeyType: HASH
              - AttributeName: date
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    # S3 Bucket for food images
    FoodImagesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:service}-food-images-${self:provider.stage}
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders:
                - '*'
              AllowedMethods:
                - GET
                - PUT
                - POST
              AllowedOrigins:
                - '*'
              MaxAge: 3000
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

  Outputs:
    UserPoolId:
      Value: !Ref CognitoUserPool
      Export:
        Name: ${self:service}-UserPoolId-${self:provider.stage}

    UserPoolClientId:
      Value: !Ref CognitoUserPoolClient
      Export:
        Name: ${self:service}-UserPoolClientId-${self:provider.stage}

    ApiGatewayUrl:
      Value: !Sub "https://${ApiGatewayRestApi}.execute-api.${self:provider.region}.amazonaws.com/${self:provider.stage}"
      Export:
        Name: ${self:service}-ApiUrl-${self:provider.stage}
